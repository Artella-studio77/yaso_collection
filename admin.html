<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yaso Collection — لوحة التحكم</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');

*{box-sizing:border-box;margin:0;padding:0}
:root{
 --bg:#f5eee4;
 --white:#fffaf4;
 --gold:#a87325;
 --gold2:#c18b3c;
 --dark:#382617;
 --muted:#806c55;
 --line:#e4d2b8;
 --danger:#b94a3a;
}
body{
 background:
 radial-gradient(circle at 10% 10%,#fff 0,transparent 30%),
 radial-gradient(circle at 90% 90%,#ead6b9 0,transparent 30%),
 var(--bg);
 color:var(--dark);
 font-family:Cairo,sans-serif;
 min-height:100vh;
}
.container{width:min(1150px,94%);margin:auto}

/* TOP */
.top{
 margin:18px auto;
 width:min(1150px,94%);
 padding:16px 25px;
 background:#fffaf4e8;
 backdrop-filter:blur(12px);
 border:1px solid var(--line);
 border-radius:22px;
 display:flex;align-items:center;justify-content:space-between;
 box-shadow:0 12px 35px #65481e18;
}
.logo{text-align:center}
.mark{
 font-family:Georgia;font-size:48px;
 letter-spacing:-13px;color:#a87529;
 text-shadow:2px 3px 2px #69461944;
}
.logo b{display:block;font-size:14px;letter-spacing:2px;color:#85571d}
.logo small{font-size:7px;letter-spacing:2px;color:#947b5c}
.back{
 border:1px solid var(--gold);color:#714918;
 background:#fffaf4;border-radius:25px;
 padding:9px 18px;font-family:inherit;cursor:pointer;
 text-decoration:none;
}

/* DASH */
.title{margin:35px 0 20px}
.title h1{font-size:30px}
.title p{color:var(--muted);font-size:14px}

.stats{
 display:grid;grid-template-columns:repeat(3,1fr);gap:15px;
 margin-bottom:25px;
}
.stat{
 background:var(--white);border:1px solid var(--line);
 border-radius:20px;padding:20px;
 box-shadow:0 8px 25px #65481e12;
}
.stat span{font-size:13px;color:var(--muted)}
.stat b{display:block;font-size:28px;color:var(--gold)}

/* FORM */
.panel{
 background:var(--white);border:1px solid var(--line);
 border-radius:25px;padding:25px;
 box-shadow:0 10px 30px #65481e14;
 margin-bottom:25px;
}
.panel h2{font-size:21px;margin-bottom:20px}
.form{
 display:grid;grid-template-columns:1fr 1fr;gap:15px;
}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
label{font-size:13px;font-weight:700}
input{
 width:100%;padding:13px 15px;
 border:1px solid #d9c5a7;border-radius:13px;
 background:#fffdf9;outline:none;font-family:inherit;
}
input:focus{border-color:var(--gold);box-shadow:0 0 0 3px #b27b3020}
.preview{
 width:110px;height:110px;border-radius:15px;
 object-fit:cover;border:1px solid var(--line);
 margin-top:8px;display:none;
}
.btn{
 border:0;border-radius:25px;padding:12px 25px;
 font-family:inherit;font-weight:700;cursor:pointer;
}
.gold{
 background:linear-gradient(135deg,#8f5d1d,#c08a3b);
 color:white;
}
.light{
 background:#f6ecdf;color:#714a1c;
 border:1px solid var(--line);
}
.buttons{display:flex;gap:10px;margin-top:5px}

/* TABLE */
.tableWrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{
 background:#f5eadb;color:#704819;
 padding:14px;text-align:right;font-size:13px;
}
td{
 padding:12px;border-bottom:1px solid var(--line);
 vertical-align:middle;font-size:13px;
}
td img{
 width:65px;height:65px;object-fit:cover;border-radius:12px;
}
.actions{display:flex;gap:7px}
.edit,.delete{
 border-radius:10px;padding:8px 13px;
 font-family:inherit;cursor:pointer;
}
.edit{border:1px solid #c79a5a;background:#fff7ea;color:#8a5d21}
.delete{border:1px solid #e0aaa0;background:#fff2ef;color:var(--danger)}
.status{
 margin-bottom:15px;padding:12px 15px;border-radius:12px;
 display:none;font-size:13px;
}
.status.show{display:block}
.success{background:#eaf3df;color:#467535}
.error{background:#fae9e5;color:#a43c2f}

@media(max-width:700px){
 .form{grid-template-columns:1fr}
 .field.full{grid-column:auto}
 .stats{grid-template-columns:1fr}
 .top{padding:12px 15px}
 .title h1{font-size:24px}
}
</style>
</head>

<body>

<header class="top">
 <a href="index.html" class="back">← العودة للموقع</a>

 <div class="logo">
   <div class="mark">YS</div>
   <b>YASO COLLECTION</b>
   <small>MODERN. LUXURY. EVENTS.</small>
 </div>

 <span style="color:#a87325;font-size:24px">♕</span>
</header>

<main class="container">

<div class="title">
 <h1>لوحة التحكم</h1>
 <p>إدارة منتجات متجر Yaso Collection بسهولة</p>
</div>

<section class="stats">
 <div class="stat">
   <span>إجمالي المنتجات</span>
   <b id="totalProducts">0</b>
 </div>
 <div class="stat">
   <span>حالة قاعدة البيانات</span>
   <b id="dbStatus" style="font-size:18px">جاري الاتصال...</b>
 </div>
 <div class="stat">
   <span>العملة</span>
   <b>دج</b>
 </div>
</section>

<section class="panel">
 <h2 id="formTitle">✦ إضافة منتج جديد</h2>

 <div id="status" class="status"></div>

 <form id="productForm" class="form">

   <div class="field">
     <label>اسم المنتج</label>
     <input id="name" required placeholder="مثال: طقم رياضي أنيق">
   </div>

   <div class="field">
     <label>السعر (دج)</label>
     <input id="prix" type="number" min="0" required placeholder="3500">
   </div>

   <div class="field full">
     <label>رابط صورة المنتج</label>
     <input id="image_url" type="url" required
            placeholder="https://...">
     <img id="preview" class="preview">
   </div>

   <div class="buttons field full">
     <button class="btn gold" id="submitBtn" type="submit">
       نشر المنتج ✦
     </button>
     <button class="btn light" type="button" onclick="resetForm()">
       إلغاء
     </button>
   </div>

 </form>
</section>

<section class="panel">
 <h2>♧ المنتجات المنشورة</h2>

 <div class="tableWrap">
  <table>
   <thead>
    <tr>
      <th>الصورة</th>
      <th>اسم المنتج</th>
      <th>السعر</th>
      <th>الإجراءات</th>
    </tr>
   </thead>
   <tbody id="productsTable">
     <tr><td colspan="4" style="text-align:center;padding:40px">جاري التحميل...</td></tr>
   </tbody>
  </table>
 </div>
</section>

</main>
